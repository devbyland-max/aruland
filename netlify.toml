# Frontend + Express API (Netlify Function) + Neon Postgres
[build]
  command = "npm run build:netlify"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  CLIENT_URL = "https://aruland.netlify.app"

[functions]
  node_bundler = "nft"

[functions.api]
  included_files = [
    "server/node_modules/.prisma/client/**",
    "server/node_modules/@prisma/client/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
