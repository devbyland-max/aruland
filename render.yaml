# Render Blueprint — API for AruLand (Neon Postgres via DATABASE_URL env)
services:
  - type: web
    name: aruland-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://aruland.netlify.app
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: ADMIN_EMAIL
        value: admin@stitchbear.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: AruLand Admin
      - key: ORDER_WHATSAPP_PHONE
        value: "355689001257"
      - key: FREE_SHIPPING_FROM
        value: "5000"
      - key: SHIPPING_FEE
        value: "300"
