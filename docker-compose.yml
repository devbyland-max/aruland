services:
  db:
    image: postgres:16-alpine
    container_name: stitchbear-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stitchbear
    ports:
      - "5434:5432"
    volumes:
      - stitchbear_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stitchbear"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stitchbear_pg_data:
